name: iOS validation and unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and build with the pinned toolchain
        shell: bash
        run: bash scripts/build-ios.sh

      - name: Save build evidence and unsigned IPA
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledger-ios-${{ github.run_number }}
          path: |
            build/ios/*/artifacts/
            build/ios/*/logs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
