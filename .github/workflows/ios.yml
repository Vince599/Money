name: iOS batch validation

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Choose compilation, business tests, UI regression, or full validation
        type: choice
        default: business
        options:
          - business
          - compile
          - ui
          - full
      ui_suite:
        description: UI path (only used for the ui scope)
        type: choice
        default: all
        options:
          - all
          - calculator
          - imports
          - refunds
          - categories
          - tags
          - accounts
          - entries
      package_ipa:
        description: Produce an unsigned IPA (requires full validation)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and build with the pinned toolchain
        shell: bash
        env:
          LEDGER_VALIDATION_SCOPE: ${{ inputs.validation_scope || 'business' }}
          LEDGER_UI_SUITE: ${{ inputs.ui_suite || 'all' }}
          LEDGER_PACKAGE_IPA: ${{ inputs.package_ipa && 'true' || 'false' }}
        run: bash scripts/build-ios.sh

      - name: Save compact validation evidence and optional IPA
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledger-ios-${{ github.run_number }}
          path: |
            build/ios/*/artifacts/*.json
            build/ios/*/artifacts/*.txt
            build/ios/*/artifacts/Package.resolved
            build/ios/*/artifacts/*.ipa
            build/ios/*/artifacts/*.sha256
            build/ios/*/artifacts/screenshots/*.png
            build/ios/*/artifacts/screenshots/*.json
            build/ios/*/logs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Preserve full test bundle for failure diagnosis
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledger-ios-${{ github.run_number }}-diagnostics
          path: build/ios/*/artifacts/AppTests.xcresult/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
